<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出發前速查 · 自由行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="content/destinations/japan/osaka.js"></script>
<script src="content/destinations/japan/osaka-essentials.js"></script>
<style>
.ess-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.ess-grid{grid-template-columns:1fr}}
.ess{border:1px solid var(--line);border-radius:12px;padding:18px 20px;background:var(--card)}
.ess h3{font-family:var(--serif);font-size:1.1rem;color:var(--ink);margin-bottom:10px;display:flex;gap:8px;align-items:center}
.ess p,.ess li{font-size:.9rem;color:var(--ink-soft);line-height:1.7}
.ess .big{font-family:var(--serif);font-size:1.3rem;color:var(--accent);margin-bottom:4px}
.ess ul{list-style:none}.ess li{padding-left:16px;position:relative;margin-bottom:6px}
.ess li::before{content:'·';position:absolute;left:4px;color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div class="topbar"><div class="wrap in">
  <a class="logo" href="index.html"><span class="dot"></span>自由行</a>
  <nav><a href="index.html">目的地</a><a href="#">主題攻略</a><a href="#">工具</a></nav>
</div></div>
<div id="view"></div>
<footer><div class="wrap">© 2026 自由行資訊站<div class="disc">簽證與入境規定可能變動，出發前請以外交部與官方為準。</div></div></footer>
<script>
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function qs(k){return new URLSearchParams(location.search).get(k)}
function render(){
  const city=qs('city')||'osaka';
  const cityData=window.CONTENT.destinations[city];
  const e=(window.CONTENT.essentials&&window.CONTENT.essentials[city]);
  const view=document.getElementById('view');
  if(!e){view.innerHTML='<div class="wrap" style="padding:60px 24px;text-align:center;color:var(--ink-soft)">尚無速查資料。</div>';return;}
  view.innerHTML=`
  <div class="city-hero"><div class="wrap"><h1>${esc(e.title)}</h1>
    <div class="summary" style="margin-top:8px">出發前與當地最常翻出來的速查卡。</div></div></div>
  <div class="wrap" style="padding-top:24px">
    <div class="crumb"><a href="index.html">目的地</a> › <a href="city.html?city=${city}">${esc(cityData?cityData.title:city)}</a> › 出發前速查</div>
    <div class="fresh">📅 更新於 ${esc(e.lastUpdated)} ｜ 來源：${esc(e.source)} ｜ 簽證以外交部公告為準</div>
    <div class="ess-grid">
      <div class="ess"><h3>🛂 簽證與入境</h3>
        <div class="big">${e.visa.visaFree?'免簽 '+e.visa.days+' 天':'需簽證'}</div>
        <p>${esc(e.visa.passport)}｜${esc(e.visa.note)}</p>
        <p style="margin-top:8px">海關：${esc(e.customs)}</p></div>
      <div class="ess"><h3>💴 貨幣與消費</h3>
        <div class="big">${esc(e.currency.code)}</div>
        <p>換匯：${esc(e.currency.exchangeTip)}</p>
        <p style="margin-top:6px">刷卡：${esc(e.currency.cardAcceptance)}｜小費：${esc(e.currency.tipping)}</p></div>
      <div class="ess"><h3>🔌 插頭與電壓</h3>
        <div class="big">${esc(e.power.plug)}</div>
        <p>${esc(e.power.voltage)}</p></div>
      <div class="ess"><h3>📶 網路 SIM</h3><p>${esc(e.sim)}</p></div>
      <div class="ess"><h3>🚨 緊急電話</h3>
        <ul><li>警察 ${esc(e.emergency.police)}</li><li>救護／消防 ${esc(e.emergency.ambulance)}</li><li>${esc(e.emergency.taiwanOffice)}</li></ul></div>
      <div class="ess"><h3>📱 實用 App</h3><ul>${e.apps.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>
      <div class="ess"><h3>🙇 禮儀與禁忌</h3><ul>${e.etiquette.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
      <div class="ess"><h3>🗣 常用短句</h3><ul>${e.phrases.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    </div>
    <p style="margin:24px 0"><a href="city.html?city=${city}" style="color:var(--accent);font-weight:600">← 回${esc(cityData?cityData.title:'')}概覽</a></p>
  </div>`;
  document.title=e.title+' · 自由行';
}
render();
</script>
</body>
</html>
