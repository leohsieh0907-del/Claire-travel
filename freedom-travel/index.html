<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">

</head>
<body>
<div class="topbar"><div class="wrap in">
  <a class="logo" href="index.html"><span class="dot"></span>自由行</a>
  <nav><a href="index.html">目的地</a><a href="guides.html">主題攻略</a><a href="#tools">工具</a><a href="my-trips.html">我的行程</a><a href="search.html">🔍</a></nav>
</div></div>

<div class="hero">
  <div class="wrap">
    <h1>為自己，規劃一場剛好的旅行</h1>
    <p>一站式、可信、會更新的國外自由行資訊與規劃工具。從發想、排行程到出發前，都幫你準備好。</p>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="sec-head">
      <span class="label">Destinations</span>
      <h2>探索目的地</h2>
    </div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="dest-grid" id="destGrid"></div>
  </div>
</section>

<section id="tools" style="background:#fff;border-top:1px solid var(--line)">
  <div class="wrap">
    <div class="sec-head"><span class="label">Tools</span><h2>實用工具</h2></div>
    <div class="dest-grid">
      <a class="dcard" href="tools/budget.html"><div class="ph" style="background:linear-gradient(135deg,var(--ink),var(--accent))"><span class="en">Budget</span></div>
        <div class="body"><h3>💰 預算計算器</h3><p>選天數人數與等級，依目的地消費基準估總花費。</p><div class="enter">開始估算 →</div></div></a>
      <a class="dcard" href="tools/packing.html"><div class="ph" style="background:linear-gradient(135deg,var(--sky),var(--accent))"><span class="en">Packing</span></div>
        <div class="body"><h3>🧳 打包清單</h3><p>依季節與旅伴產生勾選清單，離線可用。</p><div class="enter">開始打包 →</div></div></a>
      <a class="dcard" href="tools/converter.html"><div class="ph" style="background:linear-gradient(135deg,#16a085,var(--accent))"><span class="en">Convert</span></div>
        <div class="body"><h3>🔄 匯率・時差・電壓</h3><p>快速換算外幣、查時差與插頭電壓。</p><div class="enter">開始換算 →</div></div></a>
    </div>
  </div>
</section>

<footer><div class="wrap">
  © 2026 自由行資訊站
  <div class="disc">資訊僅供參考，可能隨時變動，出發前請以官方網站為準。</div>
</div></footer>

<script>
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const SEASONS={'春':[3,4,5],'夏':[6,7,8],'秋':[9,10,11],'冬':[12,1,2]};
const TIERS={'背包客':'backpacker','標準':'standard','舒適':'comfort'};
let F={region:'',season:'',budget:'',days:'',favOnly:false};
function getFavs(){try{return JSON.parse(localStorage.getItem('ziyou_favs'))||[]}catch(e){return[]}}
function isFav(s){return getFavs().includes(s)}
function toggleFav(e,s){e.preventDefault();e.stopPropagation();let f=getFavs();f=f.includes(s)?f.filter(x=>x!==s):f.concat(s);localStorage.setItem('ziyou_favs',JSON.stringify(f));render();}
function setF(k,v){F[k]=v;render();}

function pass(d){
  if(F.region&&d.region!==F.region)return false;
  if(F.season){const ms=SEASONS[F.season];if(!d.season.some(m=>ms.includes(m)))return false;}
  if(F.budget&&d.budgetTier!==TIERS[F.budget])return false;
  if(F.days==='short'&&d.daysNum>3)return false;
  if(F.days==='long'&&d.daysNum<4)return false;
  if(F.favOnly&&!isFav(d.slug))return false;
  return true;
}
function sel(k,opts,cur){return `<select onchange="setF('${k}',this.value)">${opts.map(o=>`<option value="${o[0]}"${cur===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select>`;}

function render(){
  document.getElementById('filterBar').innerHTML=`
    <label>地區 ${sel('region',[['','不限'],['日本','日本'],['韓國','韓國'],['越南','越南'],['東南亞','東南亞'],['加拿大','加拿大']],F.region)}</label>
    <label>季節 ${sel('season',[['','不限'],['春','春'],['夏','夏'],['秋','秋'],['冬','冬']],F.season)}</label>
    <label>預算 ${sel('budget',[['','不限'],['背包客','背包客'],['標準','標準'],['舒適','舒適']],F.budget)}</label>
    <label>天數 ${sel('days',[['','不限'],['short','3 天內'],['long','4 天以上']],F.days)}</label>
    <button class="fav-toggle${F.favOnly?' on':''}" onclick="setF('favOnly',${!F.favOnly})">❤ 只看收藏</button>`;
  const list=(window.CONTENT_INDEX||[]).filter(pass);
  document.getElementById('destGrid').innerHTML=list.map(d=>`
    <a class="dcard" href="city.html?city=${d.slug}">
      <div class="ph"><span class="flag">${d.flag}</span><span class="en">${esc(d.titleEn||'')}</span>
        <button class="favstar${isFav(d.slug)?' on':''}" onclick="toggleFav(event,'${d.slug}')">${isFav(d.slug)?'★':'☆'}</button>
      </div>
      <div class="body">
        <h3>${esc(d.title)}</h3>
        <div class="meta">${esc(d.country)} ｜ 建議 ${esc(d.days)} ｜ 最佳 ${esc(d.seasonLabel||'')}</div>
        <p>${esc(d.summary)}</p>
        <div class="enter">看城市概覽 →</div>
      </div>
    </a>`).join('') || '<p style="color:var(--ink-soft);grid-column:1/-1;text-align:center;padding:40px">沒有符合條件的目的地。</p>';
}
render();
</script>
</body>
</html>
