<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>攻略 · 自由行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="content/guides.js"></script>
<script src="content/destinations/japan/osaka-attractions.js"></script>
<style>
.article-body{max-width:720px;margin:0 auto}
.article-body h3{font-family:var(--serif);font-size:1.3rem;color:var(--ink);margin:28px 0 10px}
.article-body p{font-size:1.02rem;line-height:1.9;color:#33414f}
.poi-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
@media(max-width:640px){.poi-cards{grid-template-columns:1fr}}
.poi-c{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--card)}
.poi-c:hover{border-color:var(--accent)}
.poi-c .cat{font-size:.7rem;color:var(--accent);font-weight:600}
.poi-c h4{font-size:1.05rem;color:var(--ink);margin:4px 0}
.poi-c .d{font-size:.82rem;color:var(--ink-soft)}
</style>
</head>
<body>
<div class="topbar"><div class="wrap in">
  <a class="logo" href="index.html"><span class="dot"></span>自由行</a>
  <nav><a href="index.html">目的地</a><a href="guides.html">主題攻略</a><a href="index.html#tools">工具</a><a href="my-trips.html">我的行程</a></nav>
</div></div>
<div id="view"></div>
<footer><div class="wrap">© 2026 自由行資訊站<div class="disc">資訊僅供參考，出發前請以官網為準。</div></div></footer>
<script>
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function qs(k){return new URLSearchParams(location.search).get(k)}
function render(){
  const g=(window.CONTENT.guides||{})[qs('slug')];
  const atts=(window.CONTENT.attractions&&window.CONTENT.attractions[g&&g.city])||[];
  const view=document.getElementById('view');
  if(!g){view.innerHTML='<div class="wrap" style="padding:60px 24px;text-align:center;color:var(--ink-soft)">找不到攻略。<br><a href="guides.html" style="color:var(--accent)">← 回攻略列表</a></div>';return;}
  const pois=(g.relatedPois||[]).map(s=>atts.find(a=>a.slug===s)).filter(Boolean);
  view.innerHTML=`
  <div class="city-hero" style="background:${g.grad}"><div class="wrap">
    <div style="font-size:2.4rem">${g.emoji}</div>
    <h1>${esc(g.title)}</h1>
    <p class="summary" style="margin-top:12px">${esc(g.summary)}</p>
  </div></div>
  <div class="wrap" style="padding-top:24px">
    <div class="crumb"><a href="guides.html">主題攻略</a> › ${esc(g.title)}</div>
    <div class="fresh">📅 更新於 ${esc(g.lastUpdated)} ｜ 來源：${esc(g.source)}</div>
    <div class="article-body">
      ${g.sections.map(s=>`<h3>${esc(s.h)}</h3><p>${esc(s.p)}</p>`).join('')}
      ${pois.length?`<h3>相關景點</h3><div class="poi-cards">${pois.map(p=>`
        <a class="poi-c" href="attraction.html?city=${g.city}&slug=${p.slug}">
          <div class="cat">${esc(p.category)}</div><h4>${esc(p.title)}</h4><div class="d">📍 ${esc(p.area)} · ⏱ ${esc(p.duration)}</div></a>`).join('')}</div>`:''}
    </div>
    <p style="margin:24px 0;max-width:720px;margin-left:auto;margin-right:auto"><a href="guides.html" style="color:var(--accent);font-weight:600">← 回攻略列表</a></p>
  </div>`;
  document.title=g.title+' · 自由行';
}
render();
</script>
</body>
</html>
