<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>景點列表 · 自由行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="content/destinations/japan/osaka.js"></script>
<script src="content/destinations/japan/osaka-attractions.js"></script>
<script src="content/destinations/japan/kyoto.js"></script>
<script src="content/destinations/japan/kyoto-attractions.js"></script>
<script src="content/destinations/japan/okinawa.js"></script>
<script src="content/destinations/japan/okinawa-attractions.js"></script>
<style>
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.fbtn{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 18px;font-size:.85rem;color:var(--ink-soft);cursor:pointer;font-family:var(--sans)}
.fbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.acard .ph{height:120px}
.acard .cat{position:absolute;top:12px;left:14px;background:rgba(255,255,255,.92);color:var(--ink);font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:12px}
.acard .body{padding:16px 18px 20px}
.acard h3{font-size:1.15rem}
.acard .info{font-size:.8rem;color:var(--ink-soft);margin:6px 0 8px;display:flex;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="topbar"><div class="wrap in">
  <a class="logo" href="index.html"><span class="dot"></span>自由行</a>
  <nav><a href="index.html">目的地</a><a href="#">主題攻略</a><a href="#">工具</a></nav>
</div></div>

<div id="view"></div>

<footer><div class="wrap">© 2026 自由行資訊站
  <div class="disc">資訊僅供參考，可能變動，出發前請以官網為準。</div></div></footer>

<script>
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function qs(k){return new URLSearchParams(location.search).get(k)}
const CAT_COLORS={'景點':'#3B82A0','美食':'#E8833A','購物':'#9b59b6','住宿':'#16a085','體驗':'#e67e22','夜生活':'#34495e'};
let _cat='全部';

function render(){
  const city=qs('city')||'osaka';
  const cityData=window.CONTENT.destinations[city];
  const all=(window.CONTENT.attractions&&window.CONTENT.attractions[city])||[];
  const cats=['全部',...new Set(all.map(a=>a.category))];
  const list=_cat==='全部'?all:all.filter(a=>a.category===_cat);
  document.getElementById('view').innerHTML=`
  <div class="wrap" style="padding-top:20px">
    <div class="crumb"><a href="index.html">目的地</a> › <a href="city.html?city=${city}">${esc(cityData?cityData.title:city)}</a> › 景點</div>
    <div class="sec-head"><span class="label">Attractions</span><h2>${esc(cityData?cityData.title:'')}景點（${all.length}）</h2></div>
    <div class="filter-row">${cats.map(c=>`<button class="fbtn${c===_cat?' on':''}" onclick="_cat='${c}';render()">${c}</button>`).join('')}</div>
    <div class="dest-grid">${list.map(a=>`
      <a class="dcard acard" href="attraction.html?city=${city}&slug=${a.slug}">
        <div class="ph" style="background:linear-gradient(135deg,${CAT_COLORS[a.category]||'#3B82A0'},var(--accent))">
          <span class="cat">${esc(a.category)}</span>
        </div>
        <div class="body">
          <h3>${esc(a.title)}</h3>
          <div class="info"><span>📍 ${esc(a.area)}</span><span>⏱ ${esc(a.duration)}</span></div>
          <p>${esc(a.summary.slice(0,52))}${a.summary.length>52?'…':''}</p>
          <div class="enter">看詳情 →</div>
        </div>
      </a>`).join('')}</div>
  </div>`;
}
render();
</script>
</body>
</html>
