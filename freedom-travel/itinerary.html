<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>範本行程 · 自由行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="content/destinations/japan/osaka.js"></script>
<script src="content/destinations/japan/osaka-attractions.js"></script>
<script src="content/destinations/japan/osaka-itineraries.js"></script>
<script src="content/destinations/japan/kyoto.js"></script>
<script src="content/destinations/japan/kyoto-attractions.js"></script>
<script src="content/destinations/japan/kyoto-itineraries.js"></script>
<script src="content/destinations/japan/okinawa.js"></script>
<script src="content/destinations/japan/okinawa-attractions.js"></script>
<script src="content/destinations/japan/okinawa-itineraries.js"></script>
<style>
.day{margin-bottom:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.day-h{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px}
.day-h .n{font-family:var(--serif);font-size:1.3rem;color:var(--accent)}
.day-h .t{font-family:var(--serif);font-size:1.15rem}
.day-body{padding:8px 20px 16px}
.blk{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:none}
.blk .tm{font-weight:600;color:var(--sky);font-size:.88rem;padding-top:2px}
.blk h4{font-size:1.05rem;margin-bottom:3px}
.blk h4 a{color:var(--ink);border-bottom:2px solid var(--accent)}
.blk h4 a:hover{color:var(--accent)}
.blk .note{font-size:.88rem;color:var(--ink-soft)}
.blk .move{font-size:.8rem;color:var(--sky);margin-top:5px;background:#EAF1F4;display:inline-block;padding:3px 10px;border-radius:6px}
.alt{background:#FDF3E9;border:1px solid #F0D9BE;border-radius:10px;padding:16px 20px}
.alt li{margin-bottom:8px;font-size:.92rem}
</style>
</head>
<body>
<div class="topbar"><div class="wrap in">
  <a class="logo" href="index.html"><span class="dot"></span>自由行</a>
  <nav><a href="index.html">目的地</a><a href="#">主題攻略</a><a href="#">工具</a></nav>
</div></div>
<div id="view"></div>
<footer><div class="wrap">© 2026 自由行資訊站<div class="disc">資訊僅供參考，出發前請以官網為準。</div></div></footer>
<script>
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function qs(k){return new URLSearchParams(location.search).get(k)}
function render(){
  const city=qs('city')||'osaka', slug=qs('slug');
  const cityData=window.CONTENT.destinations[city];
  const all=(window.CONTENT.itineraries&&window.CONTENT.itineraries[city])||[];
  const atts=(window.CONTENT.attractions&&window.CONTENT.attractions[city])||[];
  const it=slug?all.find(x=>x.slug===slug):all[0];
  const view=document.getElementById('view');
  if(!it){view.innerHTML='<div class="wrap" style="padding:60px 24px;text-align:center;color:var(--ink-soft)">尚無範本行程。<br><a href="city.html?city='+city+'" style="color:var(--accent)">← 回城市概覽</a></div>';return;}
  const poiName=s=>{const a=atts.find(x=>x.slug===s);return a?{name:a.title,dur:a.duration}:null;};
  const blkHTML=b=>{
    const p=b.poi?poiName(b.poi):null;
    const head=p?`<h4><a href="attraction.html?city=${city}&slug=${b.poi}">${esc(p.name)}</a> <span style="font-size:.78rem;color:var(--ink-soft);font-weight:400">· ${esc(p.dur)}</span></h4>`
      :`<h4>${esc(b.title||'')}</h4>`;
    const mv=b.move?`<div class="move">🚆 ${esc(b.move.from)} → ${esc(b.move.by)} 約 ${b.move.mins} 分・¥${b.move.cost}</div>`:'';
    return `<div class="blk"><div class="tm">${esc(b.time)}</div><div>${head}${b.note?`<div class="note">${esc(b.note)}</div>`:''}${mv}</div></div>`;
  };
  view.innerHTML=`
  <div class="city-hero"><div class="wrap">
    <h1>${esc(it.title)}</h1>
    <div class="summary" style="margin-top:10px">${it.days} 天 · 主題：${esc(it.theme)} · 適合：${it.suitableFor.join('、')}</div>
    <div class="quickfacts">
      <div class="qf"><div class="k">天數</div><div class="v">${it.days} 天</div></div>
      <div class="qf"><div class="k">概估費用 / 人</div><div class="v">${it.currency} ${it.estCostPerPerson.toLocaleString()}</div></div>
      <div class="qf"><div class="k">含交通</div><div class="v">市區地鐵</div></div>
    </div>
  </div></div>
  <div class="wrap" style="padding-top:24px">
    <div class="crumb"><a href="index.html">目的地</a> › <a href="city.html?city=${city}">${esc(cityData?cityData.title:city)}</a> › 範本行程</div>
    <div class="fresh">📅 更新於 ${esc(it.lastUpdated)} ｜ 費用為概估，依季節與個人消費浮動</div>
    <div id="rmap" style="height:340px;border-radius:12px;margin-bottom:18px;border:1px solid var(--line)"></div>
    ${it.itinerary.map(d=>`
      <div class="day">
        <div class="day-h"><span class="n">Day ${d.day}</span><span class="t">${esc(d.title||'')}</span></div>
        <div class="day-body">${d.blocks.map(blkHTML).join('')}</div>
      </div>`).join('')}
    ${it.alternatives&&it.alternatives.length?`
      <div class="sec-head" style="margin-top:30px"><h2 style="font-size:1.3rem">可替換方案</h2></div>
      <div class="alt"><ul class="ilist">${it.alternatives.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`:''}
    <p style="margin:24px 0"><a href="city.html?city=${city}" style="color:var(--accent);font-weight:600">← 回${esc(cityData?cityData.title:'')}概覽</a></p>
  </div>`;
  document.title=it.title+' · 自由行';
  setTimeout(()=>initRouteMap(it,atts),60);
}
function initRouteMap(it,atts){
  if(typeof L==='undefined'||!document.getElementById('rmap'))return;
  const pts=[];
  it.itinerary.forEach(d=>d.blocks.forEach(b=>{if(b.poi){const a=atts.find(x=>x.slug===b.poi);if(a)pts.push({lat:a.coordinates.lat,lng:a.coordinates.lng,name:a.title});}}));
  if(!pts.length)return;
  const m=L.map('rmap');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(m);
  const latlngs=pts.map(p=>[p.lat,p.lng]);
  L.polyline(latlngs,{color:'#1B3A5B',weight:3,dashArray:'6,6'}).addTo(m);
  pts.forEach((p,i)=>{
    const icon=L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,13],
      html:`<div style="background:#E8833A;color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)">${i+1}</div>`});
    L.marker([p.lat,p.lng],{icon}).addTo(m).bindPopup((i+1)+'. '+p.name);
  });
  m.fitBounds(latlngs,{padding:[40,40]});
  setTimeout(()=>m.invalidateSize(),150);
}
render();
</script>
</body>
</html>
