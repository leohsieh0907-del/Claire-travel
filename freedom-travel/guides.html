<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主題攻略 · 自由行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="content/guides.js"></script>
</head>
<body>
<div class="topbar"><div class="wrap in">
  <a class="logo" href="index.html"><span class="dot"></span>自由行</a>
  <nav><a href="index.html">目的地</a><a href="guides.html">主題攻略</a><a href="index.html#tools">工具</a><a href="my-trips.html">我的行程</a></nav>
</div></div>
<section><div class="wrap">
  <div class="sec-head"><span class="label">Guides</span><h2>主題攻略</h2></div>
  <div class="dest-grid" id="grid"></div>
</div></section>
<footer><div class="wrap">© 2026 自由行資訊站</div></footer>
<script>
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const gs=Object.values(window.CONTENT.guides||{});
document.getElementById('grid').innerHTML=gs.map(g=>`
  <a class="dcard" href="guide.html?slug=${g.slug}">
    <div class="ph" style="background:${g.grad}"><span class="en" style="font-size:2rem">${g.emoji}</span></div>
    <div class="body"><h3>${esc(g.title)}</h3>
      <div class="meta">${(g.tags||[]).join(' · ')}</div>
      <p>${esc(g.summary)}</p><div class="enter">閱讀攻略 →</div></div>
  </a>`).join('')||'<p style="color:var(--ink-soft)">尚無攻略。</p>';
</script>
</body>
</html>
