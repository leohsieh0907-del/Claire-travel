<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交通指南 · 自由行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="content/destinations/japan/osaka.js"></script>
<script src="content/destinations/japan/osaka-transport.js"></script>
<script src="content/destinations/japan/kyoto.js"></script>
<script src="content/destinations/japan/kyoto-transport.js"></script>
<script src="content/destinations/japan/okinawa.js"></script>
<script src="content/destinations/japan/okinawa-transport.js"></script>
<style>
.opt{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.opt .top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.opt .nm{font-family:var(--serif);font-size:1.1rem;color:var(--ink)}
.opt .ct{font-weight:600;color:var(--accent)}
.opt .row{display:flex;gap:18px;flex-wrap:wrap;font-size:.86rem;color:var(--ink-soft);margin-bottom:6px}
.opt .pc{display:flex;gap:8px;flex-wrap:wrap;font-size:.82rem}
.opt .pro{color:var(--ok)}.opt .con{color:var(--warn)}
.opt .best{font-size:.82rem;color:var(--sky);margin-top:6px}
.pass{border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:10px}
.pass .nm{font-weight:600;color:var(--ink)}.pass .pr{color:var(--accent);font-weight:600}
.pass .nt{font-size:.86rem;color:var(--ink-soft);margin-top:4px}
</style>
</head>
<body>
<div class="topbar"><div class="wrap in">
  <a class="logo" href="index.html"><span class="dot"></span>自由行</a>
  <nav><a href="index.html">目的地</a><a href="#">主題攻略</a><a href="#">工具</a></nav>
</div></div>
<div id="view"></div>
<footer><div class="wrap">© 2026 自由行資訊站<div class="disc">票價與班次可能變動，出發前請以官網為準。</div></div></footer>
<script>
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function qs(k){return new URLSearchParams(location.search).get(k)}
function render(){
  const city=qs('city')||'osaka';
  const cityData=window.CONTENT.destinations[city];
  const t=(window.CONTENT.transport&&window.CONTENT.transport[city]);
  const view=document.getElementById('view');
  if(!t){view.innerHTML='<div class="wrap" style="padding:60px 24px;text-align:center;color:var(--ink-soft)">尚無交通指南。</div>';return;}
  view.innerHTML=`
  <div class="city-hero"><div class="wrap"><h1>${esc(t.title)}</h1>
    <div class="summary" style="margin-top:8px">機場接駁、市內交通、票券是否划算，一次看懂。</div></div></div>
  <div class="wrap" style="padding-top:24px">
    <div class="crumb"><a href="index.html">目的地</a> › <a href="city.html?city=${city}">${esc(cityData?cityData.title:city)}</a> › 交通指南</div>
    <div class="fresh">📅 更新於 ${esc(t.lastUpdated)} ｜ 來源：${esc(t.source)}</div>

    ${t.airportTransfers.map(ap=>`
      <div class="block"><h2><span class="ic">✈️</span>${esc(ap.airport)} → 市區</h2>
        ${ap.options.map(o=>`
          <div class="opt">
            <div class="top"><span class="nm">${esc(o.name)}</span><span class="ct">${o.currency} ${o.cost.toLocaleString()}</span></div>
            <div class="row"><span>⏱ ${esc(o.time)}</span></div>
            <div class="pc"><span class="pro">✓ ${o.pros.join('、')}</span><span class="con">! ${o.cons.join('、')}</span></div>
            <div class="best">👍 適合：${esc(o.bestFor)}</div>
          </div>`).join('')}
      </div>`).join('')}

    <div class="block"><h2><span class="ic">🚇</span>市內交通</h2>
      <ul class="ilist">${t.cityTransit.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>

    <div class="block"><h2><span class="ic">🎫</span>票券是否划算</h2>
      ${t.passes.map(p=>`<div class="pass"><span class="nm">${esc(p.name)}</span> · <span class="pr">${p.currency} ${p.price.toLocaleString()}</span><div class="nt">${esc(p.note)}</div></div>`).join('')}</div>

    <div class="block"><h2><span class="ic">🚄</span>城市間移動</h2>
      <ul class="ilist">${t.intercity.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>

    <div class="block"><h2><span class="ic">ℹ️</span>實務提醒</h2>
      <ul class="ilist">${t.practical.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>

    <p style="margin:24px 0"><a href="city.html?city=${city}" style="color:var(--accent);font-weight:600">← 回${esc(cityData?cityData.title:'')}概覽</a></p>
  </div>`;
  document.title=t.title+' · 自由行';
}
render();
</script>
</body>
</html>
