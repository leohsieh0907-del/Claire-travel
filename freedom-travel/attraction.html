<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>景點 · 自由行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="content/destinations/japan/osaka.js"></script>
<script src="content/destinations/japan/osaka-attractions.js"></script>
<script src="content/destinations/japan/kyoto.js"></script>
<script src="content/destinations/japan/kyoto-attractions.js"></script>
<script src="content/destinations/japan/okinawa.js"></script>
<script src="content/destinations/japan/okinawa-attractions.js"></script>
<style>
.a-hero{background:linear-gradient(135deg,var(--sky),var(--accent));color:#fff;padding:48px 0}
.a-hero .cat{display:inline-block;background:rgba(255,255,255,.9);color:var(--ink);font-size:.74rem;font-weight:600;padding:4px 12px;border-radius:12px;margin-bottom:12px}
.a-hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.8rem,4.5vw,2.5rem)}
.a-hero .local{font-size:.9rem;color:rgba(255,255,255,.82);margin-top:4px}
.a-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:0 0 22px}
@media(max-width:640px){.a-facts{grid-template-columns:1fr 1fr}}
.fact{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.fact .k{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px}
.fact .v{font-family:var(--serif);font-size:1.05rem;color:var(--ink)}
.nearby-card{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin:0 8px 8px 0;font-size:.88rem}
.nearby-card:hover{border-color:var(--accent)}
.mapbtn{display:inline-block;background:var(--accent);color:#fff;font-weight:600;font-size:.86rem;padding:10px 20px;border-radius:8px;margin-top:6px}
.mapbtn:hover{background:#d6742f}
</style>
</head>
<body>
<div class="topbar"><div class="wrap in">
  <a class="logo" href="index.html"><span class="dot"></span>自由行</a>
  <nav><a href="index.html">目的地</a><a href="#">主題攻略</a><a href="#">工具</a></nav>
</div></div>

<div id="view"></div>

<footer><div class="wrap">© 2026 自由行資訊站
  <div class="disc">資訊僅供參考，可能變動，出發前請以官網為準。</div></div></footer>

<script>
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function qs(k){return new URLSearchParams(location.search).get(k)}

function render(){
  const city=qs('city')||'osaka', slug=qs('slug');
  const cityData=window.CONTENT.destinations[city];
  const all=(window.CONTENT.attractions&&window.CONTENT.attractions[city])||[];
  const a=all.find(x=>x.slug===slug);
  const view=document.getElementById('view');
  if(!a){view.innerHTML='<div class="wrap" style="padding:60px 24px;text-align:center;color:var(--ink-soft)">找不到這個景點。<br><a href="attractions.html?city='+city+'" style="color:var(--accent)">← 回景點列表</a></div>';return;}

  const t=a.ticket;
  const ticketStr=t.adult===0?(t.note||'免費'):(t.currency+' '+t.adult+'（成人）'+(t.note?'・'+t.note:''));
  const nearby=(a.nearby||[]).map(s=>all.find(x=>x.slug===s)).filter(Boolean);
  const mapUrl='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a.title+' '+(cityData?cityData.title:''));

  view.innerHTML=`
  <div class="a-hero"><div class="wrap">
    <span class="cat">${esc(a.category)}</span>
    <h1>${esc(a.title)}</h1>
    <div class="local">${esc(a.titleLocal||'')} ・ 📍 ${esc(a.area)}</div>
  </div></div>
  <div class="wrap" style="padding-top:24px">
    <div class="crumb"><a href="index.html">目的地</a> › <a href="city.html?city=${city}">${esc(cityData?cityData.title:city)}</a> › <a href="attractions.html?city=${city}">景點</a> › ${esc(a.title)}</div>
    <div class="fresh">📅 更新於 ${esc(a.lastUpdated)} ｜ 來源：${esc(a.source)} ｜ 開放時間與票價以官網為準</div>

    <p style="font-size:1.05rem;line-height:1.9;margin-bottom:22px">${esc(a.summary)}</p>

    <div class="a-facts">
      <div class="fact"><div class="k">建議停留</div><div class="v">${esc(a.duration)}</div></div>
      <div class="fact"><div class="k">開放時間</div><div class="v" style="font-size:.92rem">${esc(a.openingHours)}</div></div>
      <div class="fact"><div class="k">門票</div><div class="v" style="font-size:.92rem">${esc(ticketStr)}</div></div>
      <div class="fact"><div class="k">最佳時段</div><div class="v" style="font-size:.92rem">${esc(a.bestTime||'—')}</div></div>
    </div>

    <div class="block">
      <h2><span class="ic">🚆</span>怎麼去</h2>
      <p>${esc(a.howToGet)}</p>
      <div id="amap" style="height:300px;border-radius:10px;margin:14px 0;border:1px solid var(--line)"></div>
      <a class="mapbtn" href="${mapUrl}" target="_blank" rel="noopener">📍 在 Google Maps 開啟</a>
    </div>

    ${a.tips&&a.tips.length?`<div class="block">
      <h2><span class="ic">💡</span>實用提醒</h2>
      <ul class="ilist">${a.tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    </div>`:''}

    ${a.bookingUrl?`<div class="block"><h2><span class="ic">🎟</span>訂票</h2>
      <a class="mapbtn" href="${a.bookingUrl}" target="_blank" rel="noopener">前往官方訂票 ↗</a></div>`:''}

    ${nearby.length?`<div class="block">
      <h2><span class="ic">🔗</span>順遊景點</h2>
      ${nearby.map(n=>`<a class="nearby-card" href="attraction.html?city=${city}&slug=${n.slug}">${esc(n.title)}（${esc(n.category)}）</a>`).join('')}
    </div>`:''}

    <p style="margin:24px 0"><a href="attractions.html?city=${city}" style="color:var(--accent);font-weight:600">← 回${esc(cityData?cityData.title:'')}景點列表</a></p>
  </div>`;
  document.title=a.title+' · 自由行';
  setTimeout(()=>initMap(a),60);
}
function initMap(a){
  if(typeof L==='undefined'||!document.getElementById('amap'))return;
  const m=L.map('amap').setView([a.coordinates.lat,a.coordinates.lng],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(m);
  L.marker([a.coordinates.lat,a.coordinates.lng]).addTo(m).bindPopup(a.title);
  setTimeout(()=>m.invalidateSize(),150);
}
render();
</script>
</body>
</html>
