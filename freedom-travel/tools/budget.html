<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>預算計算器 · 自由行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<script src="../content/index.js"></script>
<script src="../content/destinations/japan/osaka.js"></script>
<style>
.tool-wrap{max-width:760px;margin:0 auto;padding:32px 24px 80px}
.field{margin-bottom:18px}
.field label{display:block;font-weight:600;font-size:.86rem;margin-bottom:6px}
.field select,.field input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;font-size:.95rem;font-family:var(--sans);background:#fff}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.result{background:var(--ink);color:#fff;border-radius:14px;padding:26px 28px;margin-top:24px}
.result .total{font-family:var(--serif);font-size:2.2rem;color:var(--accent)}
.result .sub{display:flex;gap:30px;flex-wrap:wrap;margin-top:14px}
.result .sub .k{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.result .sub .v{font-family:var(--serif);font-size:1.3rem}
.breakdown{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-top:16px}
.breakdown tr td{padding:7px 0;border-bottom:1px dotted var(--line);font-size:.9rem}
.breakdown tr td:last-child{text-align:right;color:var(--ink);font-weight:600}
.cur-toggle{display:flex;gap:8px;margin-top:14px}
.cur-toggle button{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:6px;padding:6px 16px;cursor:pointer;font-family:var(--sans)}
.cur-toggle button.on{background:var(--accent);color:var(--ink)}
</style>
</head>
<body>
<div class="topbar"><div class="wrap in">
  <a class="logo" href="../index.html"><span class="dot"></span>自由行</a>
  <nav><a href="../index.html">目的地</a><a href="#">主題攻略</a><a href="budget.html">工具</a></nav>
</div></div>

<div class="tool-wrap">
  <div class="sec-head"><span class="label">Tool</span><h2>💰 預算計算器</h2></div>
  <p style="color:var(--ink-soft);margin-bottom:24px">選好條件，依目的地消費基準估算總花費（不含機票與購物）。</p>

  <div class="field"><label>目的地</label><select id="dest"></select></div>
  <div class="field-row">
    <div class="field"><label>天數</label><input type="number" id="days" value="5" min="1"></div>
    <div class="field"><label>人數</label><input type="number" id="people" value="2" min="1"></div>
  </div>
  <div class="field-row">
    <div class="field"><label>住宿等級</label><select id="lodging"><option value="backpacker">背包客</option><option value="standard" selected>標準</option><option value="comfort">舒適</option></select></div>
    <div class="field"><label>餐食等級</label><select id="food"><option value="backpacker">省錢</option><option value="standard" selected>標準</option><option value="comfort">講究</option></select></div>
  </div>

  <div class="result" id="result"></div>
  <div class="breakdown" id="breakdown"></div>
  <p style="font-size:.8rem;color:var(--ink-soft);margin-top:14px">交通與門票雜支以「標準」估算。匯率為參考值，實際以刷卡/銀行為準。</p>
</div>

<footer><div class="wrap">© 2026 自由行資訊站</div></footer>
<script>
let RATES={rates:{},lastUpdated:''};
let curMode='local';
fetch('../data/rates.json').then(r=>r.json()).then(d=>{RATES=d;calc();}).catch(()=>calc());

const destSel=document.getElementById('dest');
(window.CONTENT_INDEX||[]).forEach(d=>{const o=document.createElement('option');o.value=d.slug;o.textContent=d.flag+' '+d.title;destSel.appendChild(o);});

function calc(){
  const slug=destSel.value;
  const city=window.CONTENT.destinations[slug];
  if(!city||!city.budgetLevels){document.getElementById('result').innerHTML='此目的地尚無消費基準資料。';return;}
  const b=city.budgetLevels, cur=b.currency;
  const days=Math.max(1,+document.getElementById('days').value||1);
  const ppl=Math.max(1,+document.getElementById('people').value||1);
  const lodgingLv=b[document.getElementById('lodging').value];
  const foodLv=b[document.getElementById('food').value];
  const std=b.standard;
  const perDayPerson = lodgingLv.lodging + foodLv.food + std.transport + (std.sights||0);
  const total = perDayPerson * days * ppl;

  const fx = RATES.rates[cur]||null;
  const fmt = v => curMode==='twd'&&fx ? ('NT$ '+Math.round(v*fx).toLocaleString()) : (cur+' '+Math.round(v).toLocaleString());

  document.getElementById('result').innerHTML=`
    <div style="font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:6px">預估總花費（${days} 天 × ${ppl} 人）</div>
    <div class="total">${fmt(total)}</div>
    <div class="sub">
      <div><div class="k">每人</div><div class="v">${fmt(total/ppl)}</div></div>
      <div><div class="k">每人每日</div><div class="v">${fmt(perDayPerson)}</div></div>
    </div>
    <div class="cur-toggle">
      <button class="${curMode==='local'?'on':''}" onclick="curMode='local';calc()">${cur}</button>
      <button class="${curMode==='twd'?'on':''}" onclick="curMode='twd';calc()" ${fx?'':'disabled'}>台幣 TWD</button>
    </div>`;
  document.getElementById('breakdown').innerHTML=`
    <table style="width:100%;border-collapse:collapse">
      <tr><td>🏨 住宿（${document.getElementById('lodging').selectedOptions[0].text}）</td><td>${fmt(lodgingLv.lodging*days*ppl)}</td></tr>
      <tr><td>🍽 餐食（${document.getElementById('food').selectedOptions[0].text}）</td><td>${fmt(foodLv.food*days*ppl)}</td></tr>
      <tr><td>🚆 交通</td><td>${fmt(std.transport*days*ppl)}</td></tr>
      <tr><td>🎫 門票雜支</td><td>${fmt((std.sights||0)*days*ppl)}</td></tr>
    </table>`;
}
['dest','days','people','lodging','food'].forEach(id=>document.getElementById(id).addEventListener('input',calc));
calc();
</script>
</body>
</html>
