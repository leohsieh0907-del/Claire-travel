<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打包清單 · 自由行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
.tool-wrap{max-width:820px;margin:0 auto;padding:32px 24px 80px}
.opts{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.opts label{font-size:.86rem;font-weight:600}
.opts select{padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-family:var(--sans)}
.prog{font-size:.88rem;color:var(--ink-soft);margin-bottom:18px}
.prog b{color:var(--accent);font-size:1.1rem}
.cat{margin-bottom:22px}
.cat h3{font-family:var(--serif);font-size:1.1rem;color:var(--ink);margin-bottom:10px}
.items{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:560px){.items{grid-template-columns:1fr}}
.item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:.92rem;cursor:pointer}
.item.done{background:#F1F5E9;color:var(--ink-soft)}
.item.done span{text-decoration:line-through}
.item input{width:17px;height:17px;accent-color:var(--accent)}
.btn-line{background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 16px;font-size:.82rem;color:var(--ink-soft);cursor:pointer}
</style>
</head>
<body>
<div class="topbar"><div class="wrap in">
  <a class="logo" href="../index.html"><span class="dot"></span>自由行</a>
  <nav><a href="../index.html">目的地</a><a href="#">主題攻略</a><a href="budget.html">工具</a></nav>
</div></div>

<div class="tool-wrap">
  <div class="sec-head"><span class="label">Tool</span><h2>🧳 打包清單</h2></div>
  <p style="color:var(--ink-soft);margin-bottom:18px">依季節與旅伴產生清單，勾選狀態存在本機、離線可用。</p>
  <div class="opts">
    <label>季節 <select id="season"><option value="summer">夏季</option><option value="winter">冬季</option><option value="mild" selected>春秋</option></select></label>
    <label><input type="checkbox" id="baby"> 有嬰幼兒</label>
    <button class="btn-line" onclick="resetAll()">重設</button>
  </div>
  <div class="prog" id="prog"></div>
  <div id="list"></div>
</div>

<footer><div class="wrap">© 2026 自由行資訊站</div></footer>
<script>
const KEY='ziyou_packing_v1';
const BASE=[
  {cat:'證件・財務',items:['護照（效期滿6個月）','機票／訂房確認','現金與外幣','信用卡','旅遊保險單','駕照（如需）']},
  {cat:'電子・3C',items:['手機＋充電線','行動電源','萬國轉接插頭','相機／記憶卡','eSIM／網卡']},
  {cat:'盥洗・保養',items:['牙刷牙膏','保養／化妝品','防曬乳','個人盥洗用品','口罩']},
  {cat:'藥品・健康',items:['個人慢性藥','腸胃藥','感冒藥','OK繃','暈車藥']},
  {cat:'自由行必備',items:['離線地圖','行李秤','摺疊購物袋','雨傘／輕便雨衣','頸枕']}
];
const SEASON={summer:{cat:'夏季衣物',items:['排汗衣物','防曬帽','太陽眼鏡','泳具','涼鞋']},
  winter:{cat:'冬季衣物',items:['保暖外套','發熱衣','圍巾手套','毛帽','暖暖包']},
  mild:{cat:'春秋衣物',items:['洋蔥式穿搭','薄外套','長袖數件','好走的鞋']}};
const BABY={cat:'嬰幼兒',items:['尿布／濕紙巾','奶粉奶瓶','嬰兒副食品','推車／揹巾','兒童藥品','安撫玩具']};

function build(){
  let cats=[...BASE]; cats.splice(2,0,SEASON[document.getElementById('season').value]);
  if(document.getElementById('baby').checked) cats.push(BABY);
  return cats;
}
function getState(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function setDone(k,v){const s=getState();if(v)s[k]=1;else delete s[k];localStorage.setItem(KEY,JSON.stringify(s));render();}
function resetAll(){if(confirm('清除所有勾選？')){localStorage.removeItem(KEY);render();}}
function render(){
  const cats=build(), st=getState();
  let total=0,done=0;
  const html=cats.map(c=>{
    const items=c.items.map(t=>{const k=c.cat+'|'+t;total++;const d=st[k]?1:0;if(d)done++;
      return `<label class="item${d?' done':''}"><input type="checkbox" ${d?'checked':''} onchange="setDone('${k.replace(/'/g,"")}',this.checked)"><span>${t}</span></label>`;}).join('');
    return `<div class="cat"><h3>${c.cat}</h3><div class="items">${items}</div></div>`;
  }).join('');
  document.getElementById('prog').innerHTML=`已打包 <b>${done}</b> / ${total} 項`;
  document.getElementById('list').innerHTML=html;
}
document.getElementById('season').addEventListener('change',render);
document.getElementById('baby').addEventListener('change',render);
render();
</script>
</body>
</html>
