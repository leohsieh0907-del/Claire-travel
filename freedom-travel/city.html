<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>城市概覽 · 自由行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- 內容資料（資料與呈現分離）：新增城市時在此載入對應資料檔 -->
<script src="content/destinations/japan/osaka.js"></script>
<script src="content/destinations/japan/kyoto.js"></script>
<script src="content/destinations/japan/okinawa.js"></script>
<script src="content/destinations/korea/seoul.js"></script>
<script src="content/destinations/vietnam/danang.js"></script>
<script src="content/destinations/thailand/bangkok.js"></script>
<script src="content/destinations/canada/vancouver.js"></script>
</head>
<body>
<div class="topbar"><div class="wrap in">
  <a class="logo" href="index.html"><span class="dot"></span>自由行</a>
  <nav><a href="index.html">目的地</a><a href="#">主題攻略</a><a href="#">工具</a></nav>
</div></div>

<div id="view"></div>

<footer><div class="wrap">
  © 2026 自由行資訊站
  <div class="disc">資訊僅供參考，可能隨時變動，出發前請以官方網站為準。會過期的資訊均標示更新日期與來源。</div>
</div></footer>

<script>
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function qs(k){return new URLSearchParams(location.search).get(k)}
const MONTHS=['','1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function render(){
  const key=qs('city')||'osaka';
  const d=(window.CONTENT&&window.CONTENT.destinations[key]);
  const view=document.getElementById('view');
  if(!d){view.innerHTML='<div class="wrap" style="padding:60px 24px;text-align:center;color:var(--ink-soft)">找不到這個目的地。<br><a href="index.html" style="color:var(--accent)">← 回目的地列表</a></div>';return;}

  const b=d.budgetLevels;
  const sum=lv=>lv.lodging+lv.food+lv.transport+(lv.sights||0);
  const budgetCard=(lv,mid)=>`
    <div class="bcard${mid?' mid':''}">
      <h4>${lv.label}</h4>
      <div class="total">${b.currency} ${sum(lv).toLocaleString()}<span style="font-size:.7rem;color:var(--ink-soft)"> / 人·日</span></div>
      <ul>
        <li><span>住宿</span><span>${lv.lodging.toLocaleString()}</span></li>
        <li><span>餐食</span><span>${lv.food.toLocaleString()}</span></li>
        <li><span>交通</span><span>${lv.transport.toLocaleString()}</span></li>
        <li><span>門票雜支</span><span>${(lv.sights||0).toLocaleString()}</span></li>
      </ul>
    </div>`;

  view.innerHTML=`
  <div class="city-hero"><div class="wrap">
    <div class="flag">${d.flag}</div>
    <h1>${esc(d.title)}</h1>
    <div class="country">${esc(d.country)} · ${esc(d.titleEn||'')}</div>
    <p class="summary">${esc(d.summary)}</p>
    <div class="quickfacts">
      <div class="qf"><div class="k">建議天數</div><div class="v">${esc(d.suggestedDays)}</div></div>
      <div class="qf"><div class="k">最佳季節</div><div class="v">${d.bestSeason.map(m=>m+'月').join('・')}</div></div>
      <div class="qf"><div class="k">入境</div><div class="v">${d.entry.visaFree?'免簽 '+d.entry.days+' 天':'需簽證'}</div></div>
    </div>
  </div></div>

  <div class="wrap" style="padding-top:28px">
    <div class="crumb"><a href="index.html">目的地</a> › ${esc(d.country)} › ${esc(d.title)}</div>
    <div class="fresh">📅 資訊更新於 ${esc(d.lastUpdated)} ｜ 來源：${esc(d.source)} ｜ 出發前請以官網為準</div>

    <div class="block">
      <h2><span class="ic">🗓</span>何時去</h2>
      <table class="weather">
        <tr><th class="rk">月份</th>${d.weather.map(w=>`<th${d.bestSeason.includes(w.month)?' class="best"':''}>${w.month}</th>`).join('')}</tr>
        <tr><td class="rk">高溫 ℃</td>${d.weather.map(w=>`<td${d.bestSeason.includes(w.month)?' class="best"':''}>${w.tempHigh}</td>`).join('')}</tr>
        <tr><td class="rk">低溫 ℃</td>${d.weather.map(w=>`<td${d.bestSeason.includes(w.month)?' class="best"':''}>${w.tempLow}</td>`).join('')}</tr>
        <tr><td class="rk">雨量 mm</td>${d.weather.map(w=>`<td${d.bestSeason.includes(w.month)?' class="best"':''}>${w.rainfall}</td>`).join('')}</tr>
      </table>
      <p style="margin-top:12px;font-size:.86rem;color:var(--ink-soft)">橘色為推薦月份。重要節慶：</p>
      <ul class="ilist" style="margin-top:8px">${d.festivals.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>
    </div>

    <div class="block">
      <h2><span class="ic">💰</span>預算等級（每人每日）</h2>
      <div class="budget-grid">
        ${budgetCard(b.backpacker)}${budgetCard(b.standard,true)}${budgetCard(b.comfort)}
      </div>
      <p style="margin-top:12px;font-size:.82rem;color:var(--ink-soft)">幣別 ${b.currency}，含住宿／餐食／交通／門票雜支，不含機票與購物。</p>
    </div>

    <div class="block">
      <h2><span class="ic">🛂</span>入境重點</h2>
      <ul class="ilist">
        <li>${esc(d.entry.passport)}：${d.entry.visaFree?'免簽證':'需簽證'}，可停留 ${d.entry.days} 天</li>
        <li>${esc(d.entry.note)}</li>
      </ul>
    </div>

    <div class="block">
      <h2><span class="ic">🛡</span>安全與健康</h2>
      <ul class="ilist">${d.safetyNotes.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
      <div class="chips" style="margin-top:14px">
        <span class="chip">🚓 警察 ${esc(d.emergency.police)}</span>
        <span class="chip">🚑 救護 ${esc(d.emergency.ambulance)}</span>
        <span class="chip">🏢 ${esc(d.emergency.taiwanOffice)}</span>
      </div>
    </div>

    <div class="block">
      <h2><span class="ic">🔗</span>快速連結</h2>
      <div class="qlinks">
        ${d.quickLinks.map(q=>`<a class="qlink${q.soon?' soon':''}" href="${q.href}">
          <div class="ic">${q.ic}</div><div class="t">${esc(q.title)}</div><div class="d">${esc(q.desc)}</div>
          ${q.soon?'<div class="badge">建置中</div>':''}
        </a>`).join('')}
      </div>
    </div>
  </div>`;
  document.title=d.title+' 城市概覽 · 自由行';
}
render();
</script>
</body>
</html>
