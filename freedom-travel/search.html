<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搜尋 · 自由行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="content/index.js"></script>
<script src="content/guides.js"></script>
<script src="content/destinations/japan/osaka-attractions.js"></script>
<script src="content/destinations/japan/kyoto-attractions.js"></script>
<script src="content/destinations/japan/okinawa-attractions.js"></script>
<style>
.search-box{width:100%;padding:16px 20px;border:2px solid var(--line);border-radius:12px;font-size:1.1rem;font-family:var(--sans);outline:none}
.search-box:focus{border-color:var(--accent)}
.res-group{margin-top:28px}
.res-group h3{font-family:var(--serif);font-size:1.15rem;color:var(--ink);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.res{display:block;padding:12px 16px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--card)}
.res:hover{border-color:var(--accent)}
.res .t{font-weight:600;color:var(--ink)}
.res .t .tag{font-size:.72rem;color:var(--accent);font-weight:600;margin-left:8px}
.res .d{font-size:.85rem;color:var(--ink-soft);margin-top:2px}
.empty{color:var(--ink-soft);padding:30px 0}
</style>
</head>
<body>
<div class="topbar"><div class="wrap in">
  <a class="logo" href="index.html"><span class="dot"></span>自由行</a>
  <nav><a href="index.html">目的地</a><a href="guides.html">主題攻略</a><a href="index.html#tools">工具</a><a href="my-trips.html">我的行程</a></nav>
</div></div>
<section><div class="wrap" style="max-width:760px">
  <div class="sec-head"><span class="label">Search</span><h2>站內搜尋</h2></div>
  <input class="search-box" id="q" placeholder="搜尋目的地、景點、攻略…（例：大阪、章魚燒、親子）" autofocus>
  <div id="res"></div>
</div></section>
<footer><div class="wrap">© 2026 自由行資訊站</div></footer>
<script>
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const dests=(window.CONTENT_INDEX||[]);
const guides=Object.values(window.CONTENT.guides||{});
const atts=[];Object.keys(window.CONTENT.attractions||{}).forEach(c=>(window.CONTENT.attractions[c]||[]).forEach(a=>atts.push(Object.assign({_city:c},a))));
function search(q){
  q=q.trim().toLowerCase(); if(!q)return null;
  const hit=(...fs)=>fs.filter(Boolean).join(' ').toLowerCase().includes(q);
  return {
    dests:dests.filter(d=>hit(d.title,d.titleEn,d.country,d.summary)),
    atts:atts.filter(a=>hit(a.title,a.titleLocal,a.summary,a.area,a.category)),
    guides:guides.filter(g=>hit(g.title,g.summary,(g.tags||[]).join(' '),(g.sections||[]).map(s=>s.h+s.p).join(' ')))
  };
}
function group(title,arr,fn){return arr.length?`<div class="res-group"><h3>${title}（${arr.length}）</h3>${arr.map(fn).join('')}</div>`:'';}
function render(){
  const r=search(document.getElementById('q').value);
  const box=document.getElementById('res');
  if(!r){box.innerHTML='<p class="empty">輸入關鍵字開始搜尋。</p>';return;}
  const total=r.dests.length+r.atts.length+r.guides.length;
  if(!total){box.innerHTML='<p class="empty">找不到符合的結果，換個關鍵字試試。</p>';return;}
  box.innerHTML=
    group('目的地',r.dests,d=>`<a class="res" href="city.html?city=${d.slug}"><div class="t">${d.flag} ${esc(d.title)}<span class="tag">目的地</span></div><div class="d">${esc(d.summary)}</div></a>`)+
    group('景點',r.atts,a=>`<a class="res" href="attraction.html?city=${a._city}&slug=${a.slug}"><div class="t">${esc(a.title)}<span class="tag">${esc(a.category)}</span></div><div class="d">📍 ${esc(a.area)}・${esc(a.summary.slice(0,40))}…</div></a>`)+
    group('主題攻略',r.guides,g=>`<a class="res" href="guide.html?slug=${g.slug}"><div class="t">${g.emoji} ${esc(g.title)}<span class="tag">攻略</span></div><div class="d">${esc(g.summary)}</div></a>`);
}
document.getElementById('q').addEventListener('input',render);
// 支援 ?q= 直接帶入
const pq=new URLSearchParams(location.search).get('q');
if(pq){document.getElementById('q').value=pq;}
render();
</script>
</body>
</html>
