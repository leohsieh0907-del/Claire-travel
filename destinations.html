<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>璟松 · 目的地靈感</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="璟松">
<meta name="theme-color" content="#1C3A2D">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jura:wght@300;400;500&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --pine:#1C3A2D; --gold:#C4A35A; --sage:#8A9E8F;
  --charcoal:#2C2C2C; --ivory:#F4EFE6; --divider:#D2CABE;
  --serif:'Cormorant Garamond',serif; --tc:'Noto Serif TC',serif; --label:'Jura',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--tc);color:var(--charcoal);background:var(--ivory);line-height:1.8;font-weight:300}
.label{font-family:var(--label);letter-spacing:.28em;text-transform:uppercase;font-size:.72rem;color:var(--sage)}
button{font-family:var(--label);cursor:pointer;border:none;letter-spacing:.1em;transition:all .25s}
a{color:inherit;text-decoration:none}
.top-rule{height:5px;background:var(--gold)}

header{background:var(--pine);color:var(--ivory);padding:24px 40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
header .brand{display:flex;align-items:center;gap:14px;cursor:pointer}
header .mark{width:36px;height:36px;color:var(--gold)}
header h1{font-family:var(--tc);font-weight:400;font-size:1.32rem;letter-spacing:.16em}
header h1 small{font-family:var(--label);letter-spacing:.2em;font-size:.68rem;color:var(--gold);display:block;text-transform:uppercase;margin-top:2px}
header nav{display:flex;gap:26px;align-items:center}
header nav a{font-family:var(--label);letter-spacing:.16em;font-size:.76rem;text-transform:uppercase;color:rgba(244,239,230,.8)}
header nav a:hover,header nav a.active{color:var(--gold)}
@media(max-width:680px){header nav{gap:16px}}

.wrap{max-width:1140px;margin:0 auto;padding:54px 40px 90px}
@media(max-width:640px){.wrap{padding:36px 22px 70px}}
.intro{text-align:center;margin-bottom:20px}
.intro .label{display:block;margin-bottom:16px}
.intro h2{font-family:var(--tc);font-weight:300;font-size:clamp(2rem,5vw,2.8rem);letter-spacing:.14em;color:var(--pine)}
.intro .sub{font-family:var(--serif);font-style:italic;font-size:1.25rem;color:var(--sage);margin-top:10px}
.intro .line{width:50px;height:1px;background:var(--gold);margin:24px auto 0}
.family-note{text-align:center;font-size:.9rem;color:var(--sage);margin-bottom:46px;letter-spacing:.04em}

/* grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:30px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.isl{background:#fff;border:1px solid var(--divider);overflow:hidden;cursor:pointer;transition:transform .4s,box-shadow .4s;display:flex;flex-direction:column}
.isl:hover{transform:translateY(-6px);box-shadow:0 22px 48px rgba(28,58,45,.14)}
.isl .ph{height:200px;display:flex;align-items:flex-end;padding:24px;position:relative}
.isl .ph .en{font-family:var(--label);letter-spacing:.3em;font-size:.74rem;color:rgba(244,239,230,.92);text-transform:uppercase}
.isl .ph .flag{position:absolute;top:20px;right:22px;font-size:1.6rem}
.isl .ph .badge{position:absolute;top:20px;left:22px;background:var(--gold);color:var(--pine);font-family:var(--label);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;padding:5px 12px}
.isl .body{padding:26px 28px 30px;flex:1;display:flex;flex-direction:column}
.isl h3{font-family:var(--tc);font-weight:400;font-size:1.6rem;letter-spacing:.08em;color:var(--pine);margin-bottom:6px}
.isl .tags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.isl .tag{font-family:var(--label);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--sage);border:1px solid var(--divider);padding:4px 10px}
.isl .days{font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--gold);margin-bottom:10px}
.isl p{font-size:.93rem;color:var(--charcoal);opacity:.85;flex:1}
.isl .view{font-family:var(--label);letter-spacing:.16em;text-transform:uppercase;font-size:.74rem;color:var(--gold);margin-top:20px;transition:letter-spacing .3s}
.isl:hover .view{letter-spacing:.26em}

/* detail */
.detail{max-width:840px;margin:0 auto}
.detail .back{font-family:var(--label);font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sage);cursor:pointer;margin-bottom:30px;display:inline-block}
.detail .back:hover{color:var(--pine)}
.detail .d-hero{height:260px;border-radius:2px;display:flex;flex-direction:column;justify-content:flex-end;padding:30px;margin-bottom:34px;position:relative}
.detail .d-hero .flag{position:absolute;top:24px;right:28px;font-size:2rem}
.detail .d-hero .en{font-family:var(--label);letter-spacing:.34em;font-size:.8rem;color:rgba(244,239,230,.9);text-transform:uppercase;margin-bottom:8px}
.detail .d-hero h2{font-family:var(--tc);font-weight:400;font-size:2.6rem;letter-spacing:.1em;color:var(--ivory)}
.detail .meta-row{display:flex;gap:40px;flex-wrap:wrap;margin-bottom:34px;padding-bottom:30px;border-bottom:1px solid var(--divider)}
.detail .meta-item .k{font-family:var(--label);text-transform:uppercase;letter-spacing:.16em;font-size:.66rem;color:var(--sage);margin-bottom:6px}
.detail .meta-item .v{font-family:var(--tc);font-size:1.15rem;color:var(--pine)}
.detail h4{font-family:var(--tc);font-weight:600;font-size:1.05rem;color:var(--pine);letter-spacing:.06em;margin:0 0 16px}
.detail .hl{list-style:none;margin-bottom:34px}
.detail .hl li{position:relative;padding-left:26px;margin-bottom:12px;font-size:1rem;color:var(--charcoal)}
.detail .hl li::before{content:'';position:absolute;left:0;top:11px;width:7px;height:7px;background:var(--gold);border-radius:50%}
.detail .fambox{background:#EDE6D8;border-left:3px solid var(--gold);padding:20px 24px;margin-bottom:40px}
.detail .fambox .k{font-family:var(--label);text-transform:uppercase;letter-spacing:.16em;font-size:.66rem;color:var(--sage);margin-bottom:8px}
.detail .fambox p{font-size:.98rem;color:var(--charcoal);line-height:1.9}
/* compare */
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:18px}
@media(max-width:680px){.cmp-grid{grid-template-columns:1fr}}
.cmp-col{background:#fff;border:1px solid var(--divider);padding:0;overflow:hidden}
.cmp-col.accent{border:2px solid var(--gold)}
.cmp-h{padding:20px 22px;background:#EDE6D8;border-bottom:1px solid var(--divider)}
.cmp-col.accent .cmp-h{background:var(--pine)}
.cmp-h h5{font-family:var(--tc);font-weight:600;font-size:1.2rem;color:var(--pine);letter-spacing:.06em;margin:0 0 8px}
.cmp-col.accent .cmp-h h5{color:var(--ivory)}
.cmp-price{font-family:var(--tc);font-size:1.32rem;color:var(--pine)}
.cmp-col.accent .cmp-price{color:var(--gold)}
.cmp-fam{font-family:var(--label);font-size:.74rem;letter-spacing:.08em;color:var(--sage);margin-top:4px}
.cmp-col.accent .cmp-fam{color:rgba(244,239,230,.7)}
.cmp-sec{padding:14px 22px;border-bottom:1px solid #f0ece3}
.cmp-sec:last-child{border-bottom:none}
.cmp-k{font-family:var(--label);text-transform:uppercase;letter-spacing:.14em;font-size:.64rem;color:var(--gold);margin-bottom:10px}
.cmp-days,.cmp-pro,.cmp-con{list-style:none;margin:0}
.cmp-days li,.cmp-pro li,.cmp-con li{font-size:.88rem;line-height:1.7;margin-bottom:7px;padding-left:18px;position:relative;color:var(--charcoal)}
.cmp-days li::before{content:'·';position:absolute;left:4px;color:var(--sage);font-weight:700}
.cmp-pro li::before{content:'✓';position:absolute;left:0;color:#3a7d54;font-size:.8rem}
.cmp-con li::before{content:'!';position:absolute;left:3px;color:#b5793a;font-weight:700;font-size:.8rem}
.cmp-cost{width:100%;border-collapse:collapse}
.cmp-cost td{font-size:.86rem;padding:5px 0;border-bottom:1px dotted #e6e0d4;color:var(--charcoal)}
.cmp-cost td:last-child{text-align:right;color:var(--pine);white-space:nowrap;padding-left:10px}
.cmp-note{font-size:.8rem;color:var(--sage);margin-bottom:36px;line-height:1.7}
/* info */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:38px}
@media(max-width:680px){.info-grid{grid-template-columns:1fr}}
.info-card{background:#fff;border:1px solid var(--divider);padding:20px 22px}
.info-h{font-family:var(--tc);font-weight:600;font-size:1.08rem;color:var(--pine);letter-spacing:.05em;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #f0ece3}
.info-area{font-size:.9rem;color:var(--gold);margin-bottom:10px;font-weight:400}
.info-card ul{list-style:none;margin:0}
.info-card li{font-size:.9rem;line-height:1.75;margin-bottom:8px;padding-left:16px;position:relative;color:var(--charcoal)}
.info-card li::before{content:'·';position:absolute;left:3px;color:var(--sage);font-weight:700}
.info-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:12px;border-top:1px dotted #e6e0d4}
.info-link{font-family:var(--label);font-size:.72rem;letter-spacing:.06em;color:var(--pine);border:1px solid var(--divider);padding:6px 12px;transition:all .25s}
.info-link:hover{border-color:var(--gold);color:var(--gold)}
.info-card.wide{grid-column:1 / -1;background:#fffdf8;border-color:var(--gold)}
.info-card.wide ul.two-col{columns:2;column-gap:30px}
@media(max-width:680px){.info-card.wide ul.two-col{columns:1}}
/* grid tools */
.grid-tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.view-toggle{display:flex;border:1px solid var(--divider)}
.vt{background:transparent;font-family:var(--label);letter-spacing:.1em;font-size:.74rem;color:var(--sage);padding:9px 18px;cursor:pointer;border:none}
.vt.active{background:var(--pine);color:var(--ivory)}
.gt-right{display:flex;gap:10px}
.gt-btn{background:transparent;border:1px solid var(--divider);font-family:var(--label);letter-spacing:.08em;font-size:.74rem;color:var(--sage);padding:9px 16px;cursor:pointer}
.gt-btn:hover{border-color:var(--sage);color:var(--pine)}
.gt-btn.on{background:var(--gold);color:var(--pine);border-color:var(--gold)}
.fav{position:absolute;top:16px;right:18px;background:rgba(244,239,230,.92);border:none;width:32px;height:32px;border-radius:50%;font-size:1.1rem;color:var(--gold);cursor:pointer;line-height:1;z-index:2;transition:transform .2s}
.fav:hover{transform:scale(1.15)}
.fav.on{color:#C4A35A}
/* list view */
.grid.listview{grid-template-columns:1fr;gap:14px}
.isl.row{flex-direction:row}
.isl.row .ph{width:180px;height:auto;min-height:120px;flex-shrink:0}
.isl.row .fav{top:10px;right:10px;width:28px;height:28px;font-size:.95rem}
@media(max-width:560px){.isl.row{flex-direction:column}.isl.row .ph{width:100%;height:160px}}
/* compare table */
.cmp-table-wrap{overflow-x:auto;margin-bottom:18px}
.cmp-table{width:100%;border-collapse:collapse;min-width:560px}
.cmp-table th{background:var(--pine);color:var(--ivory);font-family:var(--tc);font-weight:400;font-size:1rem;padding:14px 12px;text-align:center;letter-spacing:.04em}
.cmp-table th:first-child{background:transparent}
.cmp-table td{padding:13px 12px;text-align:center;border-bottom:1px solid var(--divider);font-size:.92rem;color:var(--charcoal)}
.cmp-table td.rk{font-family:var(--label);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--sage);text-align:left;white-space:nowrap}
.cmp-table tbody tr:nth-child(odd) td:not(.rk){background:#fff}
.cmp-go{background:var(--gold);color:var(--pine);border:none;font-family:var(--label);letter-spacing:.08em;font-size:.7rem;padding:8px 14px;cursor:pointer}
.cmp-go:hover{background:#d6b76e}
/* map */
.islmap{height:400px;border:1px solid var(--divider);margin-bottom:10px;z-index:0}
.islmap .leaflet-popup-content{font-family:var(--tc);font-size:.9rem}
@media(max-width:640px){.islmap{height:320px}}
.cta-row{display:flex;gap:14px;flex-wrap:wrap}
.btn{padding:16px 34px;font-size:.8rem;text-transform:uppercase;letter-spacing:.16em}
.btn-gold{background:var(--gold);color:var(--pine)}
.btn-gold:hover{background:#d6b76e;transform:translateY(-2px)}
.btn-line{background:transparent;border:1px solid var(--pine);color:var(--pine)}
.btn-line:hover{background:var(--pine);color:var(--ivory)}
.tpl-note{font-size:.84rem;color:var(--sage);margin-top:16px;line-height:1.7}

footer{background:var(--charcoal);color:rgba(244,239,230,.55);text-align:center;padding:40px;font-family:var(--label);letter-spacing:.22em;font-size:.72rem;text-transform:uppercase}
</style>
</head>

const V=()=>document.getElementById('view');
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

let _gridView='grid', _favOnly=false;
const REGION={okinawa:'日本',bali:'東南亞',phuket:'東南亞',boracay:'東南亞',seoul:'韓國',danang:'越南',tokyo:'日本',osaka:'日本'};
const MONTH_TIP={
  '1':'1月：日本可賞雪泡湯，東南亞為乾季舒適','2':'2月：東南亞乾季宜人，農曆春節機票貴',
  '3':'3月：氣候舒適、人潮少，CP 值高','4':'4月：泰國潑水節熱鬧，天氣漸熱',
  '5':'5月：東南亞進入雨季前緣，沖繩舒適','6':'6月：暑假前夕，沖繩梅雨、東南亞雨季',
  '7':'7月：暑假旺季，機票飯店貴、較熱，提早 3 個月訂','8':'8月：暑假旺季同上，留意颱風',
  '9':'9月：暑假後降價，留意颱風季','10':'10月：秋高氣爽，沖繩最舒適',
  '11':'11月：東南亞進乾季、沖繩涼爽宜人','12':'12月：耶誕跨年旺季，機票偏貴'
};
let _filters={region:'',days:'',budget:'',month:''};
function setFilter(k,v){_filters[k]=v;showGrid();}
function islMinDays(i){const m=(i.days||'').match(/\d+/);return m?+m[0]:99;}
function islPrice(i){if(!i.compare)return 0;const m=i.compare.free.perPerson.replace(/[^\d]/g,'');return +m||0;}
function passFilter(i){
  if(_filters.region && REGION[i.key]!==_filters.region) return false;
  if(_filters.days==='short' && islMinDays(i)>5) return false;
  if(_filters.days==='long' && islMinDays(i)<6) return false;
  if(_filters.budget==='low' && islPrice(i)>30000) return false;
  if(_filters.budget==='high' && islPrice(i)<=30000) return false;
  return true;
}
function getFavs(){try{return JSON.parse(localStorage.getItem('jingsong_favs'))||[]}catch(e){return[]}}
function isFav(k){return getFavs().includes(k)}
function toggleFav(e,k){e.stopPropagation();let f=getFavs();f=f.includes(k)?f.filter(x=>x!==k):f.concat(k);localStorage.setItem('jingsong_favs',JSON.stringify(f));showGrid();}
function setGridView(v){_gridView=v;showGrid();}
function toggleFavOnly(){_favOnly=!_favOnly;showGrid();}

function showGrid(){
  let list=islands.filter(passFilter);
  if(_favOnly) list=list.filter(i=>isFav(i.key));
  const card=i=>`
    <div class="isl${_gridView==='list'?' row':''}" onclick="showDetail('${i.key}')">
      <div class="ph" style="background:${i.grad}">
        ${i.badge?`<span class="badge">${i.badge}</span>`:''}
        <button class="fav${isFav(i.key)?' on':''}" onclick="toggleFav(event,'${i.key}')" title="收藏">${isFav(i.key)?'★':'☆'}</button>
        <span class="flag">${i.flag}</span>
        <span class="en">${i.en}</span>
      </div>
      <div class="body">
        <h3>${i.name}</h3>
        <div class="days">建議 ${i.days} · ${i.style}</div>
        <div class="tags">${i.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <p>${i.teaser}</p>
        <span class="view">查看完整建議 →</span>
      </div>
    </div>`;
  V().innerHTML=`
  <div class="intro">
    <span class="label">Destinations</span>
    <h2>下一個目的地，去哪裡？</h2>
    <div class="sub">Pick a destination. We'll plan the rest.</div>
    <div class="line"></div>
  </div>
  <p class="family-note">以下為「5 大 2 小（11 歲＋6 歲）」家庭篩選 · 點選目的地看完整建議</p>
  <div class="filter-bar">
    <label>地區
      <select onchange="setFilter('region',this.value)">
        <option value=""${_filters.region===''?' selected':''}>不限</option>
        <option value="日本"${_filters.region==='日本'?' selected':''}>日本</option>
        <option value="韓國"${_filters.region==='韓國'?' selected':''}>韓國</option>
        <option value="越南"${_filters.region==='越南'?' selected':''}>越南</option>
        <option value="東南亞"${_filters.region==='東南亞'?' selected':''}>東南亞</option>
      </select>
    </label>
    <label>天數
      <select onchange="setFilter('days',this.value)">
        <option value=""${_filters.days===''?' selected':''}>不限</option>
        <option value="short"${_filters.days==='short'?' selected':''}>5 天以內</option>
        <option value="long"${_filters.days==='long'?' selected':''}>6 天以上</option>
      </select>
    </label>
    <label>預算 / 人
      <select onchange="setFilter('budget',this.value)">
        <option value=""${_filters.budget===''?' selected':''}>不限</option>
        <option value="low"${_filters.budget==='low'?' selected':''}>3 萬以內</option>
        <option value="high"${_filters.budget==='high'?' selected':''}>3 萬以上</option>
      </select>
    </label>
    ${(_filters.region||_filters.days||_filters.budget)?`<button class="filter-clear" onclick="_filters={region:'',days:'',budget:'',month:''};showGrid()">✕ 清除</button>`:''}
  </div>
  <div class="grid-tools">
    <div class="view-toggle">
      <button class="vt${_gridView==='grid'?' active':''}" onclick="setGridView('grid')">圖片版</button>
      <button class="vt${_gridView==='list'?' active':''}" onclick="setGridView('list')">文字版</button>
    </div>
    <div class="gt-right">
      <button class="gt-btn${_favOnly?' on':''}" onclick="toggleFavOnly()">❤ 只看收藏</button>
      <button class="gt-btn" onclick="showCompare()">🆚 目的地比較</button>
    </div>
  </div>
  <div class="grid${_gridView==='list'?' listview':''}">${list.map(card).join('')||'<p style="color:var(--sage);grid-column:1/-1;text-align:center;padding:40px">還沒有收藏的目的地，點卡片上的 ☆ 收藏。</p>'}</div>`;
  window.scrollTo(0,0);
}

function showCompare(){
  const FLIGHT={okinawa:'約 1.5 小時',bali:'約 5.5 小時',phuket:'約 3.5 小時',boracay:'約 3.5 小時＋轉船'};
  const KID={okinawa:'★★★★★',bali:'★★★★☆',phuket:'★★★★☆',boracay:'★★★★☆'};
  const rows=[
    ['建議天數',i=>i.days],
    ['旅行風格',i=>i.style],
    ['自由行 / 人',i=>i.compare?i.compare.free.perPerson:'—'],
    ['跟團 / 人',i=>i.compare?i.compare.tour.perPerson:'—'],
    ['飛行時間',i=>FLIGHT[i.key]||'—'],
    ['親子適合',i=>KID[i.key]||'—']
  ];
  V().innerHTML=`<div class="detail">
    <span class="back" onclick="showGrid()">← 回到所有目的地</span>
    <div class="intro"><span class="label">Compare</span><h2>目的地一覽比較</h2><div class="line"></div></div>
    <div class="cmp-table-wrap"><table class="cmp-table">
      <thead><tr><th></th>${islands.map(i=>`<th>${i.flag}<br>${i.name}</th>`).join('')}</tr></thead>
      <tbody>
        ${rows.map(r=>`<tr><td class="rk">${r[0]}</td>${islands.map(i=>`<td>${r[1](i)}</td>`).join('')}</tr>`).join('')}
        <tr><td class="rk"></td>${islands.map(i=>`<td><button class="cmp-go" onclick="showDetail('${i.key}')">看詳情</button></td>`).join('')}</tr>
      </tbody>
    </table></div>
    <p class="cmp-note">價格為 5 大 2 小暑假估算，實際依航班與飯店浮動。</p>
  </div>`;
  window.scrollTo(0,0);
}

function compareHTML(c){
  const col=(d,accent)=>`
    <div class="cmp-col${accent?' accent':''}">
      <div class="cmp-h">
        <h5>${d.title}</h5>
        <div class="cmp-price">${d.perPerson}</div>
        <div class="cmp-fam">${d.family}</div>
      </div>
      <div class="cmp-sec"><div class="cmp-k">每日推薦</div>
        <ul class="cmp-days">${d.days.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      </div>
      <div class="cmp-sec"><div class="cmp-k">費用明細</div>
        <table class="cmp-cost">${d.cost.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>
      </div>
      <div class="cmp-sec"><div class="cmp-k">優點</div>
        <ul class="cmp-pro">${d.pros.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      </div>
      <div class="cmp-sec"><div class="cmp-k">要留意</div>
        <ul class="cmp-con">${d.cons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      </div>
    </div>`;
  return `<h4 style="margin-top:8px">自由行 vs 旅行社</h4>
    <div class="cmp-grid">${col(c.free,true)}${col(c.tour,false)}</div>
    <p class="cmp-note">${esc(c.note)}</p>`;
}

function infoHTML(n){
  const list=a=>a.map(x=>`<li>${esc(x)}</li>`).join('');
  const plat=(n.hotel.platforms||[]).map(p=>`<a href="${p.url}" target="_blank" rel="noopener" class="info-link">${esc(p.name)} ↗</a>`).join('');
  return `<h4 style="margin-top:8px">自由行實用資訊</h4>
    <div class="info-grid">
      <div class="info-card">
        <div class="info-h">🏨 飯店・訂房</div>
        ${n.hotel.area?`<p class="info-area">${esc(n.hotel.area)}</p>`:''}
        <ul>${list(n.hotel.tips)}</ul>
        ${plat?`<div class="info-links">${plat}</div>`:''}
      </div>
      <div class="info-card"><div class="info-h">🚗 交通</div><ul>${list(n.transport)}</ul></div>
      <div class="info-card"><div class="info-h">🍽 用餐</div><ul>${list(n.dining)}</ul></div>
      <div class="info-card"><div class="info-h">🏥 醫療・安全</div><ul>${list(n.medical)}</ul></div>
      ${n.localPicks?`<div class="info-card wide"><div class="info-h">🌟 在地推薦・真實名店</div><ul class="two-col">${list(n.localPicks)}</ul></div>`:''}
    </div>`;
}

function showDetail(key){
  const i=islands.find(x=>x.key===key);if(!i)return showGrid();
  V().innerHTML=`<div class="detail">
    <span class="back" onclick="showGrid()">← 回到所有目的地</span>
    <div class="d-hero" style="background:${i.grad}">
      <span class="flag">${i.flag}</span>
      <div class="en">${i.en}</div>
      <h2>${i.name}</h2>
    </div>
    <div class="meta-row">
      <div class="meta-item"><div class="k">建議天數</div><div class="v">${i.days}</div></div>
      <div class="meta-item"><div class="k">旅行風格</div><div class="v">${i.style}</div></div>
      <div class="meta-item"><div class="k">適合對象</div><div class="v">5 大 2 小家庭</div></div>
    </div>
    <h4>亮點</h4>
    <ul class="hl">${i.highlights.map(h=>`<li>${esc(h)}</li>`).join('')}</ul>
    <div class="fambox"><div class="k">為什麼適合你們家</div><p>${esc(i.family)}</p></div>
    ${i.compare?compareHTML(i.compare):''}
    ${i.info?infoHTML(i.info):''}
    ${i.map?`<h4 style="margin-top:8px">景點地圖</h4><div id="islmap" class="islmap"></div><p class="cmp-note">點地圖上的標記看景點名稱；可縮放與拖曳。</p>`:''}
    <div class="cta-row">
      ${i.template
        ? `<button class="btn btn-gold" onclick="loadTemplate('${i.key}')">＋ 載入這份行程到「行程規劃」</button>
           <a class="btn btn-line" href="journal.html">先建旅遊日誌草稿</a>`
        : `<button class="btn btn-line" onclick="requestTemplate('${i.name}')">為我客製這條路線</button>`}
    </div>
    ${i.template
      ? `<p class="tpl-note">點「載入」會把這份 ${i.days} 行程加入你的行程規劃系統（不會覆蓋現有行程），可自行微調與列印。</p>`
      : `<p class="tpl-note">這個目的地的完整每日行程範本還在規劃中。點「為我客製」會告訴你如何讓設計師為你排——或先用「行程規劃」自行建立。</p>`}
  </div>`;
  window.scrollTo(0,0);
  if(i.map) setTimeout(()=>initMap(i.map),60);
}

let _map=null;
function initMap(m){
  if(typeof L==='undefined')return;
  const el=document.getElementById('islmap');if(!el)return;
  if(_map){_map.remove();_map=null;}
  _map=L.map('islmap',{scrollWheelZoom:false}).setView(m.center,m.zoom);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(_map);
  m.pois.forEach((p,idx)=>{
    L.marker([p.lat,p.lng]).addTo(_map).bindPopup('<b>'+(idx+1)+'. '+p.name+'</b>');
  });
  setTimeout(()=>_map.invalidateSize(),120);
}

function loadTemplate(key){
  const i=islands.find(x=>x.key===key);
  if(!i||!i.template){return;}
  const t=JSON.parse(JSON.stringify(i.template));
  localStorage.setItem('jingsong_pending_trip',JSON.stringify(t));
  alert('已選好「'+i.name+'」行程！\n接著請在行程規劃頁登入，行程會自動加入你的雲端帳號。');
  location.href='itinerary.html';
}

function requestTemplate(name){
  alert('「'+name+'」的完整行程範本規劃中。\n\n你可以：\n1. 在對話中告訴旅遊設計師，立即為你客製\n2. 先到「行程規劃」自行建立每日行程');
}
